name: 007{NUMBER}
description: Default GoldenEye 007 Template
game: "GoldenEye 007"
requires:
  version: 0.6.6

GoldenEye 007:
  # Goal
  # Cradle: Beat Cradle. All Missions: Beat all 20. All Missions All Difficulties: Why do you hate yourself?
  goal:
    cradle: 50
    all_missions: 0
    all_missions_all_difficulties: 0

  # Starting Mission
  # Which mission starts unlocked
  # Choices: Random, dam, facility, runway, surface_1, bunker_1, silo, frigate, surface_2, bunker_2, statue, archives, streets, depot, train, jungle, control, caverns, cradle, aztec, egyptian
  starting_mission: random

  # Mission Clear Mode
  # Each map is one check or one check per difficulty per stage (20 locations vs 60)
  mission_clear_mode:
    per_difficulty: 0
    per_map: 50

  # Objective Mode
  # Choose whether objectives are tracked separately per difficulty or shared across all difficulties.
  objective_mode:
    per_difficulty: 0
    shared: 50

  # Progressive Weapons
  # Makes the progression more interesting. It's like gun game, but you unlock them in order up to Golden Gun, but starting with Klobb lol
  progressive_weapons:
    'false': 0
    'true': 50

  # Add Extra Levels
  # Enable Aztec, Egyptian, or both
  extra_locations:
    aztec: 0
    egyptian: 0
    both: 0
    'false': 50

  # Shuffle Items
  # Choose for freestanding, NPC Drops and Handoffs, and Key items to be shuffled.
  item_shuffle:
    per_difficulty: 0
    shared: 50
    off: 0

  # Gun Pickups
  # Choose if guns will be allowed to be picked up from guards, just the ammo, or not at all. Intended option for this randomizer is just ammo as you unlock guns through progressive weapon option.
  gun_pickup:
    on: 0
    just_ammo: 50
    off: 0

  # Body Armor Sanity
  # Body armor locations send checks
  body_armor_sanity:
    per_difficulty: 0
    shared: 0
    off: 50

  # Ammo Crate Sanity
  # Ammo Crate locations send checks
  ammo_crate_sanity:
    per_difficulty: 0
    shared: 0
    off: 50

  # Cheats Shuffler
  # Cheat Unlock level speedruns are now locations for checks, and cheats are now items in the pool that will automatically enable.
  cheat_shuffler:
    'false': 50
    'true': 0

  # Skip Cutscenes
  # Set to true if you've seen enough of that fucking green truck and want to just play
  skip_cutscenes:
    'false': 50
    'true': 0

  # Randomize Music
  # Level, intro and menu music will be randomized.
  randomize_music:
    'false': 50
    'true': 0

  # Randomize Enemies
  # Enemy and Bond models will be randomized. Enemy positions and behaviors stay the same.
  randomize_enemies:
    'false': 50
    'true': 0

  # randomize_enemy_loadouts
  # Enemy weapons can be anything for every enemy in either or both hands
  randomize_enemy_loadouts:
    'false': 50
    'true': 0

  # SFX Randomization
  # Weapons Only shuffles attacks, slappers, throws, reloads, clicks and switches. Categories combines attacks, explosions and impacts; ricochets/flybys and casings each stay separate. Equip, reload and click sounds join electronics/interface. True Random shuffles all sound effects. Continuous sounds retain their stop behavior. Off keeps native sounds.
  sfx_randomization:
    weapons_only: 0
    catagories: 0
    true_random: 0
    off: 50

  # Goldeneye Trap
  # Pretty self explainatory honestly...
  goldeneye_trap:
    'false': 50
    'true': 0

  # Holster Gun Trap
  # Oh, whoops, ooh! I dropped my magnum
  holster_gun_trap:
    'false': 50
    'true': 0

  # Auto Fail Trap
  # Suddenly fail all objectives in current level
  auto_fail_trap:
    'false': 50
    'true': 0

  # Trap Chance
  # Chance for junk to become trap (0=none 100=fuck you)
  trap_chance: 0

  # DeathLink
  # When Bond dies you die in real life
  death_link:
    'false': 50
    'true': 0

  progression_balancing:
    normal: 50

  accessibility:
    full: 50

  local_items:
    []

  non_local_items:
    []

  start_inventory:
    {}

  start_hints:
    []

  start_location_hints:
    []

  exclude_locations:
    []

  priority_locations:
    []

  item_links:
    []
