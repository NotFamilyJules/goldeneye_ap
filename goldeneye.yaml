name: 007{NUMBER}
description: Default GoldenEye 007 Template
game: "GoldenEye 007"
requires:
  version: 0.6.6

GoldenEye 007:
  # Goal
  # Cradle: Beat Cradle. All Missions: Beat all 20.
  goal:
    cradle: 50
    all_missions: 0

  # Starting Mission
  # Which mission starts unlocked. Random chooses uniformly from enabled missions during generation.
  # Choices: Random, dam, facility, runway, surface_1, bunker_1, silo, frigate, surface_2, bunker_2, statue, archives, streets, depot, train, jungle, control, caverns, cradle, aztec, egyptian
  starting_mission: random

  # Add Extra Levels
  # Enable Aztec, Egyptian, or both
  extra_locations:
    aztec: 0
    egyptian: 0
    both: 0
    'false': 50

  # Objective Mode
  # Choose whether objectives are tracked separately per difficulty or shared across all difficulties.
  objective_mode:
    per_difficulty: 0
    shared: 50

  # Shuffle Items
  # Choose for items to be shuffled. While freestanding guns will be checks, freestanding objective objects will be unattainable, NPC dropped items, and NPC handoff items will not be attainable until unlocked. Loadout items will be available at the start of the mission only if unlocked.
  item_shuffle:
    per_difficulty: 0
    shared: 50
    off: 0

  # Gun Pickups
  # Choose if guns will be allowed to be picked up from guards, just the ammo, or not at all. Intended option for this randomizer is just ammo as you unlock guns through progressive weapon option.
  gun_pickup:
    on: 0
    just_ammo: 50
    off: 0

  # Mission Clear Mode
  # Each map is one check or one check per difficulty per stage (20 locations vs 60)
  mission_clear_mode:
    per_difficulty: 0
    per_map: 50

  # Progressive Weapons
  # Makes the progression more interesting. It's like gun game, but you unlock them in order up to Golden Gun, but starting with Klobb lol
  progressive_weapons:
    'false': 0
    'true': 50

  # DeathLink
  # When Bond dies you die in real life
  death_link:
    'false': 50
    'true': 0

  # Trap Chance
  # Chance for junk to become trap (0=none 100=fuck you)
  trap_chance: 0

  # Goldeneye Trap
  # Pretty self explainatory honestly...
  goldeneye_trap:
    'false': 50
    'true': 0

  # Enemy Rockets Trap
  # Weight of enemy rockets trap
  enemy_rockets_trap: 100

  # Holster Gun Trap
  # Weight of holster gun trap
  holster_gun_trap: 25

  progression_balancing:
    normal: 50

  accessibility:
    full: 50

  local_items:
    []

  non_local_items:
    []

  start_inventory:
    {}

  start_hints:
    []

  start_location_hints:
    []

  exclude_locations:
    []

  priority_locations:
    []

  item_links:
    []
